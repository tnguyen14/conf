name: Pull schedule from Sessionize

on:
  workflow_dispatch:
    inputs:
      conference:
        description: Conference folder to update
        required: true
        default: kubecon-na-2026
  # To refresh automatically during a conference, uncomment (times are UTC):
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pull-schedule
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      CONFERENCE: ${{ inputs.conference || 'kubecon-na-2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pull-sessionize.js "$CONFERENCE"
      - name: Commit and deploy if the schedule changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update $CONFERENCE schedule from Sessionize"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows,
          # so start the deploy explicitly.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh workflow run deploy.yml --ref main
          fi
